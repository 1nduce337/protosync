name: ProtoSync
options:
  bundleIdPrefix: app.protosync
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ProtoSyncPackage:
    path: ..
targets:
  ProtoSync:
    type: application
    platform: iOS
    sources:
      - path: ProtoSync
      # 与 macOS 共用同一份设计令牌,避免两份拷贝漂移
      - path: ../Sources/ProtoSyncApp/SignalTheme.swift
    dependencies:
      - package: ProtoSyncPackage
        products:
          - Core
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ProtoSync/Info.plist
      properties:
        CFBundleDisplayName: ProtoSync
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: ProtoSync 需要访问本地网络,以发现并安全连接附近的设备同步剪贴板与文件。
        NSBonjourServices:
          - _protosync._tcp
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
